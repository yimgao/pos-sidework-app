services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: possidework
      POSTGRES_PASSWORD: pos-sidework-dev-only
      POSTGRES_DB: pos_sidework
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://possidework:pos-sidework-dev-only@db:5432/pos_sidework
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
